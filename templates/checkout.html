<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout - ShopEasy</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            🛒 ShopEasy
        </div>


        <nav>

            <a href="/">
                Home
            </a>

            <a href="/#products">
                Products
            </a>

        </nav>


        <a href="/cart" class="cart-link">

            🛒 Cart
            <span id="cart-count">0</span>

        </a>

    </header>



    <!-- Checkout -->

    <main class="checkout-page">

        <h1>
            Checkout
        </h1>


        <div class="checkout-container">


            <!-- Customer Form -->

            <div class="checkout-form">

                <h2>
                    Customer Information
                </h2>


                <form id="checkout-form">


                    <label for="customer-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="customer-name"
                        required
                    >


                    <label for="customer-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="customer-email"
                        required
                    >


                    <label for="customer-phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="customer-phone"
                        required
                    >


                    <label for="customer-address">
                        Delivery Address
                    </label>

                    <textarea
                        id="customer-address"
                        rows="4"
                        required
                    ></textarea>


                    <button
                        type="submit"
                        class="place-order-button"
                    >
                        Place Order
                    </button>

                </form>

            </div>



            <!-- Order Summary -->

            <div class="checkout-summary">

                <h2>
                    Order Summary
                </h2>


                <div id="checkout-items">
                    <!-- JavaScript -->
                </div>


                <div class="checkout-total">

                    <span>
                        Total
                    </span>

                    <strong id="checkout-total">
                        ₹0
                    </strong>

                </div>

            </div>

        </div>

    </main>



    <!-- Footer -->

    <footer>

        <p>
            © 2026 ShopEasy. All rights reserved.
        </p>

    </footer>



    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
